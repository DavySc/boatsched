# boatsched nginx site config.
#
# Install as /etc/nginx/conf.d/boatsched.conf  (so the http-context directives
# below — limit_req_zone — load correctly), then:
#   1. set `server_name` to your real domain (replace example.com)
#   2. obtain a cert:   certbot --nginx -d example.com
#      (certbot rewrites the listen/ssl_* lines; the manual block below is a
#       reference if you manage certs yourself)
#   3. nginx -t && systemctl reload nginx
#
# The app itself binds to 127.0.0.1:8000 (see docker-compose.yml /
# boatsched-docker.service); nginx is the only public listener and terminates TLS.

# --- rate-limit zones (http context) -------------------------------------
# Login is the brute-force target: cap hard. Everything else gets a generous
# bucket that never interferes with normal use or the single long-lived collab
# WebSocket (which is one connection, not repeated requests).
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

# --- HTTP :80 — redirect everything to HTTPS (keep ACME challenge open) ---
server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS :443 ----------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    # Certbot manages these paths; adjust the domain if needed.
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- security headers ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # The SPA is a single inlined bundle (inline script/style), no third-party hosts.
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' wss: ws:; img-src 'self' data:; base-uri 'self'; frame-ancestors 'none'" always;

    # --- limits ---
    client_max_body_size 5m;           # matches app max_upload_bytes
    client_body_timeout 30s;

    # Long timeouts for slow solver runs and persistent collab sockets.
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;

    # Pass the real client IP through for the app's login rate limiter.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # General traffic.
    location / {
        limit_req zone=general burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    # Login endpoint — strict throttle on top of the app-level limiter.
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    # Collaborative editing WebSocket — needs Upgrade headers + long timeout.
    location /collab/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
