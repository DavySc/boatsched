# boatsched — production stack (Rust server, containerized).
#
# The host only needs Docker; the image is self-contained (binary + OR-Tools
# native libs). Managed on the box by deploy/boatsched-docker.service.
#
#   docker compose pull   # registry-based deploy (default)
#   docker compose build  # build-on-host fallback (uses rust/Dockerfile)
#   docker compose up -d
#
# The app is SINGLE-PROCESS by design (in-memory sessions / collab docs / jobs).
# Do NOT add replicas or a second web process.

services:
  boatsched:
    # Registry image by default; `docker compose build` also works (build-on-host
    # fallback) because the build context is declared too.
    image: ${BOATSCHED_IMAGE:-boatsched:local}
    # Build context is the repo root: the image embeds src/boatsched/viewer.html
    # (outside rust/) at compile time, so the whole repo must be in context.
    build:
      context: .
      dockerfile: rust/Dockerfile
    container_name: boatsched
    restart: unless-stopped

    # Run as the host `deploy` user (uid:gid 1000:1000) that owns the bind-mounted
    # DB dir, instead of the image's built-in uid 10001. This lets the live
    # /var/lib/boatsched (owned by deploy) be used as-is — no chown needed, and the
    # DB files stay deploy-owned. Change this if your deploy user isn't 1000:1000.
    user: "1000:1000"

    # Bind to localhost ONLY — nginx (TLS, rate limiting, headers) is the public
    # listener and proxies to 127.0.0.1:8000. Never publish this to 0.0.0.0.
    ports:
      - "127.0.0.1:8000:8000"

    # Bind-mount the REAL DB directory so the live boatsched.db (+ WAL/SHM) is
    # used unchanged — no data migration, no named-volume copy. The Rust server
    # opens it in WAL mode.
    volumes:
      - /var/lib/boatsched:/data

    # Secrets + SOLVER_WORKERS come from the existing env file (root:deploy 0640).
    # Required: BOATSCHED_ADMIN, BOATSCHED_ADMIN_PW.
    env_file:
      - /etc/boatsched/env
    environment:
      - BOATSCHED_DB=/data/boatsched.db
      - BOATSCHED_REQUIRE_AUTH=1
      - BOATSCHED_SECURE_COOKIES=1
      - BOATSCHED_MIN_PASSWORD_LEN=8

    # Container-level liveness; the cutover script ALSO polls /api/health from the
    # host before/after handover. /api/health is public (no auth).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # OR-Tools maps executable memory — do NOT add a seccomp/no-exec profile (or
    # MemoryDenyWriteExecute-style restriction) that blocks executable mmap.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
