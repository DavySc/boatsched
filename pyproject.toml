[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "boatsched"
version = "0.1.0"
description = "Boat assignment optimizer with lexicographic level constraints (CP-SAT)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "ortools>=9.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=5",
]

[project.scripts]
boatsched = "boatsched.cli:main"
boatsched-server = "boatsched.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
boatsched = ["viewer.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=boatsched --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["boatsched"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
