name: CI/CD

# Test on every push to main AND on every PR; deploy only on main, and only if
# the test job passed (deploy: needs: test).
#   - the `test` job runs `cargo test` directly (no Docker) on ubuntu-24.04, which
#     matches the OR-Tools ubuntu-24.04 SDK ABI (same base as rust/Dockerfile);
#   - the `deploy` job just SSHes to the box, which builds the image itself
#     (BUILD_ON_HOST=1) and runs the never-break-prod cutover. The on-box build
#     ALSO runs cargo test, so the gate is enforced twice (CI + at deploy time).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    # Heavy: compiles the workspace + the OR-Tools C++ FFI and downloads the SDK.
    timeout-minutes: 45
    # ubuntu:24.04 to match the OR-Tools ubuntu-24.04 SDK ABI (glibc/libstdc++),
    # exactly like rust/Dockerfile. Every step is shell-only (no JS actions) so the
    # container needs no Node — we clone manually instead of using actions/checkout.
    container:
      image: ubuntu:24.04
    env:
      ORTOOLS_ROOT: /opt/or-tools
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential g++ pkg-config curl ca-certificates git xz-utils

      - name: Checkout (manual; public repo, no Node needed)
        run: |
          git clone "${GITHUB_SERVER_URL:-https://github.com}/${GITHUB_REPOSITORY}.git" repo
          # A PR's GITHUB_SHA is its merge commit under refs/pull/N/merge, which a plain clone lacks.
          git -C repo fetch origin "${GITHUB_REF}"
          git -C repo checkout "${GITHUB_SHA}"

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs \
            | sh -s -- -y --no-modify-path --default-toolchain none
          cd repo/rust && "$HOME/.cargo/bin/rustup" show

      - name: Fetch OR-Tools SDK (pinned 9.15.6755, ubuntu-24.04)
        run: |
          curl -fsSL -o /tmp/ortools.tar.gz \
            "https://github.com/google/or-tools/releases/download/v9.15/or-tools_amd64_ubuntu-24.04_cpp_v9.15.6755.tar.gz"
          mkdir -p /opt/or-tools
          tar xzf /tmp/ortools.tar.gz -C /opt/or-tools --strip-components=1
          test -f /opt/or-tools/include/ortools/sat/cp_model.h

      - name: Build the web frontend (typecheck + bundle, embedded by the server)
        run: |
          curl -fsSL https://nodejs.org/dist/v22.17.1/node-v22.17.1-linux-x64.tar.xz \
            | tar -xJ -C /usr/local --strip-components=1
          cd repo/web
          npm ci
          npm run build

      - name: cargo test (workspace, locked)
        run: |
          . "$HOME/.cargo/env"
          cd repo/rust
          cargo test --workspace --locked

  verify-spec:
    # Build the Lean 4 formal spec — this type-checks every definition AND every
    # proof (a green `lake build` IS the proof check), including the Tier-2
    # refinement theorems that bind the Aeneas-extracted model of rust/crates/core
    # to BoatschedSpec (EXT-AUTH/EXT-VAL). Purely additive: it does NOT gate the
    # deploy job (deploy still `needs: test` only) and does not touch the Rust
    # build. Make it a REQUIRED check in branch protection so a proof
    # regression blocks merge. See spec/README.md.
    runs-on: ubuntu-24.04
    # Mathlib's prebuilt oleans + the Aeneas release build are downloaded, not
    # compiled, so wall-time is dominated by the cache fetch, not CPU.
    timeout-minutes: 45
    container:
      image: ubuntu:24.04
    env:
      DEBIAN_FRONTEND: noninteractive
      # elan/lake honour these; keep the toolchain + caches inside the workspace.
      ELAN_HOME: /root/.elan
    steps:
      - name: Install build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl ca-certificates git git-lfs build-essential

      - name: Checkout (manual; public repo, no Node needed)
        run: |
          git clone "${GITHUB_SERVER_URL:-https://github.com}/${GITHUB_REPOSITORY}.git" repo
          # A PR's GITHUB_SHA is its merge commit under refs/pull/N/merge, which a plain clone lacks.
          git -C repo fetch origin "${GITHUB_REF}"
          git -C repo checkout "${GITHUB_SHA}"

      # Freshness gate: re-extract the real core with the pinned Charon+Aeneas and
      # fail if the checked-in model differs, so the refinement proofs can't go
      # stale against rust/crates/core. Pins match spec/README.md.
      - name: Install Charon + Aeneas and Rust nightly for extraction
        run: |
          mkdir -p /opt/aeneas
          curl -fsSL https://github.com/AeneasVerif/aeneas/releases/download/nightly-2026.07.21-a827e6f/aeneas-linux-x86_64.tar.gz \
            | tar xz -C /opt/aeneas
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs \
            | sh -s -- -y --no-modify-path --default-toolchain none
          "$HOME/.cargo/bin/rustup" toolchain install nightly-2026-06-01 --profile minimal \
            -c rustc-dev -c rust-src -c llvm-tools-preview

      - name: Extraction is up to date (git diff --exit-code)
        run: |
          export PATH="/opt/aeneas:$HOME/.cargo/bin:$PATH"
          # Standalone crate: the workspace Cargo.toml uses workspace deps, which
          # charon would drag in; core's source is all that matters.
          mkdir -p extract/src
          cp -r repo/rust/crates/core/src/. extract/src/
          cat > extract/Cargo.toml <<'EOF2'
          [package]
          name = "boatsched-core"
          edition = "2021"
          version = "0.1.0"

          [lib]
          name = "boatsched_core"
          path = "src/lib.rs"

          [dependencies]
          thiserror = "1"
          serde = { version = "1", features = ["derive"] }
          EOF2
          printf '[toolchain]\nchannel = "nightly-2026-06-01"\ncomponents = ["rustc-dev", "rust-src", "llvm-tools-preview"]\n' > extract/rust-toolchain.toml
          cd extract
          charon cargo --preset=aeneas \
            --start-from 'boatsched_core::validate' \
            --start-from 'boatsched_core::authz::can_perform' \
            --start-from 'boatsched_core::authz::guard_set_admin'
          aeneas -backend lean -split-files -loops-to-rec -subdir BoatschedExtract \
            -dest out boatsched_core.llbc
          for f in Types Funs; do
            diff -u "../repo/spec/BoatschedExtract/$f.lean" "out/BoatschedExtract/$f.lean"
          done

      - name: Install elan (Lean toolchain manager)
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$ELAN_HOME/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache (prebuilt oleans — download, not compile)
        run: |
          export PATH="$ELAN_HOME/bin:$PATH"
          cd repo/spec
          # elan auto-installs the toolchain pinned by spec/lean-toolchain.
          lake exe cache get

      - name: lake build (type-checks all definitions + proofs; downloads Aeneas release build)
        run: |
          export PATH="$ELAN_HOME/bin:$PATH"
          cd repo/spec
          lake build

  deploy:
    needs: test
    # Only deploy on a push to main — never on PRs, and never if `test` failed.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    steps:
      # ssh client is preinstalled on the runner.
      # The box builds the image itself (BUILD_ON_HOST=1) and runs the cutover.
      - name: Deploy over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          # Write the deploy key and pinned host key to a private temp dir.
          KEY_DIR="$(mktemp -d)"
          trap 'rm -rf "$KEY_DIR"' EXIT
          install -m 600 /dev/null "$KEY_DIR/id_deploy"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY_DIR/id_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$KEY_DIR/known_hosts"

          # Host key is pinned via known_hosts — StrictHostKeyChecking stays on.
          # deploy.sh: pull → backup → build-on-host → validate-on-copy → handover
          # → health-gate → auto-rollback. It never leaves prod broken.
          ssh -i "$KEY_DIR/id_deploy" \
              -o IdentitiesOnly=yes \
              -o UserKnownHostsFile="$KEY_DIR/known_hosts" \
              -o StrictHostKeyChecking=yes \
              "$SSH_USER@$SSH_HOST" \
              'bash /opt/boatsched/deploy/deploy.sh'
