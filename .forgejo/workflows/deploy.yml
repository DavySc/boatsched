name: CD

# Deploy on every push to main, using a Codeberg SHARED runner (codeberg-small).
#
# Codeberg's shared runners can't build OCI images (no privileged Docker on the
# shared infra), so this workflow does NOT build/push an image. It only SSHes to
# the box and runs deploy.sh, which builds the image ON THE BOX
# (BUILD_ON_HOST=1 in /etc/boatsched/env) and then does the never-break-prod
# cutover. The multi-stage build still runs `cargo test` as the gate — on the box
# at build time — so a failing test fails the deploy.
#
# (A registry-based build job — `docker build` + push from CI — only works on a
# runner that can build images, e.g. a self-hosted one. See git history /
# deploy/README.md if you ever move to that model.)
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: codeberg-small
    container:
      image: ghcr.io/catthehacker/ubuntu:act-latest
    # Redundant guard (the trigger is already main-only): never deploy off main.
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      # ssh client + git are already present in the image; no install needed.
      - name: Deploy over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          # Write the deploy key and pinned host key to a private temp dir.
          KEY_DIR="$(mktemp -d)"
          trap 'rm -rf "$KEY_DIR"' EXIT
          install -m 600 /dev/null "$KEY_DIR/id_deploy"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY_DIR/id_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$KEY_DIR/known_hosts"

          # Host key is pinned via known_hosts — StrictHostKeyChecking stays on.
          # deploy.sh: pull → backup → build-on-host → validate-on-copy → handover
          # → health-gate → auto-rollback. It never leaves prod broken.
          ssh -i "$KEY_DIR/id_deploy" \
              -o IdentitiesOnly=yes \
              -o UserKnownHostsFile="$KEY_DIR/known_hosts" \
              -o StrictHostKeyChecking=yes \
              "$SSH_USER@$SSH_HOST" \
              'bash /opt/boatsched/deploy/deploy.sh'
