name: CI/CD

# Test on every push to main; deploy only if tests pass.
on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Fail clearly if something hangs instead of burning the runner's wall-clock cap.
    timeout-minutes: 20
    container:
      # node:22-bookworm is a fraction of the catthehacker act image to pull on
      # Codeberg's slow shared runners, yet still ships node (for the JS actions
      # below) and git (buildpack-deps base, used by actions/checkout). Debian
      # bookworm's system python3 is already 3.11, so we apt-install it directly
      # instead of actions/setup-python — that action can't fetch interpreters
      # from Codeberg's network ("version 3.11 was not found").
      image: node:22-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        # bookworm ships CPython 3.11; venv keeps us off PEP-668 externally-managed
        # restrictions. Matches the deployment baseline within requires-python>=3.9.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-venv
          python3 -m venv /opt/venv

      # Cache the pip download dir so the heavy ortools wheel isn't re-fetched on
      # every run — the main thing pushing this job past the time limit.
      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: /root/.cache/pip
          key: pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-

      - name: Install package with dev extras
        run: |
          /opt/venv/bin/pip install --upgrade pip
          /opt/venv/bin/pip install ".[dev]"

      - name: Run tests
        # --no-cov: coverage is pure overhead for a pass/fail gate (it's collected
        # locally via the pyproject addopts when developing).
        run: /opt/venv/bin/pytest --no-cov

  deploy:
    needs: test
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/catthehacker/ubuntu:act-latest
    # Redundant guard (the trigger is already main-only): never deploy off main.
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      # ssh client + git are already present in the image; no install needed.
      # (These runners can't run a Docker daemon — we only SSH out, so that's fine.)
      - name: Deploy over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          # Write the deploy key and pinned host key to a private temp dir.
          KEY_DIR="$(mktemp -d)"
          trap 'rm -rf "$KEY_DIR"' EXIT
          install -m 600 /dev/null "$KEY_DIR/id_deploy"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY_DIR/id_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$KEY_DIR/known_hosts"

          # Host key is pinned via known_hosts — StrictHostKeyChecking stays on.
          ssh -i "$KEY_DIR/id_deploy" \
              -o IdentitiesOnly=yes \
              -o UserKnownHostsFile="$KEY_DIR/known_hosts" \
              -o StrictHostKeyChecking=yes \
              "$SSH_USER@$SSH_HOST" \
              'bash /opt/boatsched/deploy/deploy.sh'
