name: CI/CD

# Build + test the Rust image on every push to main; deploy only if it builds.
on:
  push:
    branches: [main]

env:
  # Codeberg container registry. The image is self-contained (Rust binary +
  # OR-Tools native libs), so the production host only needs Docker.
  REGISTRY: codeberg.org
  IMAGE: codeberg.org/oventosti/boatsched

jobs:
  build:
    runs-on: docker
    # The multi-stage build compiles the workspace, downloads the OR-Tools SDK,
    # and runs `cargo test` as the gate — give it room on slow shared runners.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # NOTE: this job needs a runner that can build OCI images (Docker socket /
      # buildx). `runs-on: docker` assumes such a runner is registered. If the
      # shared runner cannot build images, remove this whole `build` job and set
      # BUILD_ON_HOST=1 for deploy.sh (build-on-host fallback) — see deploy/README.md.
      - name: Log in to the container registry
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" \
            | docker login "$REGISTRY" -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Build image (compiles + runs cargo test in the builder stage)
        run: |
          docker build \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            -f rust/Dockerfile .

      - name: Push image
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  deploy:
    needs: build
    runs-on: codeberg-small
    container:
      image: ghcr.io/catthehacker/ubuntu:act-latest
    # Redundant guard (the trigger is already main-only): never deploy off main.
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      # ssh client + git are already present in the image; no install needed.
      # The box pulls the image we just pushed and runs the gated cutover.
      - name: Deploy over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          # Write the deploy key and pinned host key to a private temp dir.
          KEY_DIR="$(mktemp -d)"
          trap 'rm -rf "$KEY_DIR"' EXIT
          install -m 600 /dev/null "$KEY_DIR/id_deploy"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY_DIR/id_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$KEY_DIR/known_hosts"

          # Host key is pinned via known_hosts — StrictHostKeyChecking stays on.
          # deploy.sh: backup → pull → validate-on-copy → handover → health-gate
          # → auto-rollback. It never leaves prod broken.
          ssh -i "$KEY_DIR/id_deploy" \
              -o IdentitiesOnly=yes \
              -o UserKnownHostsFile="$KEY_DIR/known_hosts" \
              -o StrictHostKeyChecking=yes \
              "$SSH_USER@$SSH_HOST" \
              'bash /opt/boatsched/deploy/deploy.sh'
